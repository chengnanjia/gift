<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 宴席礼金记录簿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f2e9;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #c8102e;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #c8102e;
            box-shadow: 0 0 0 2px rgba(200, 16, 46, 0.1);
        }
        
        .error-message {
            color: #f44336;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #c8102e, #e83e3e);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(200, 16, 46, 0.3);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #c8102e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 15px;
            font-size: 1.1em;
        }
        
        .loading-container {
            text-align: center;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>宴席礼金记录簿</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" required placeholder="请输入用户名">
                <div class="error-message" id="usernameError"></div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" required placeholder="请输入密码">
                <div class="error-message" id="passwordError"></div>
            </div>
            <button type="submit">登录</button>
        </form>
    </div>
    
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">登录中...</div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script>
        const LOGIN_API_BASE_URL = window.appConfig ? window.appConfig.API_BASE_URL : 'http://localhost:3000';

        // 加载动画控制
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
        
        // 显示错误信息
        function showError(field, message) {
            const input = document.getElementById(field);
            const errorDiv = document.getElementById(field + 'Error');
            input.classList.add('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
        
        // 清除错误信息
        function clearErrors() {
            const inputs = document.querySelectorAll('input');
            const errorDivs = document.querySelectorAll('.error-message');
            inputs.forEach(input => input.classList.remove('error'));
            errorDivs.forEach(div => {
                div.textContent = '';
                div.classList.remove('show');
            });
        }
        
        // 凭据只发送给后端验证；令牌仅保存在当前浏览器会话中。
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // 简单的前端验证
            if (!username) {
                showError('username', '请输入用户名');
                return;
            }
            
            if (!password) {
                showError('password', '请输入密码');
                return;
            }
            
            const loginUrl = `${LOGIN_API_BASE_URL}/api/auth/login`;
            const submitButton = document.querySelector('#loginForm button[type="submit"]');
            submitButton.disabled = true;
            showLoading();

            try {
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json().catch(() => null);
                if (!response.ok || !result || result.code !== 200) {
                    showError('password', result?.message || `登录失败（HTTP ${response.status}）`);
                    return;
                }

                sessionStorage.setItem('authToken', result.data.token);
                localStorage.setItem('user', JSON.stringify({ username: result.data.username }));
                window.location.href = 'index.html';
            } catch (error) {
                console.error('登录请求失败:', error);
                showError('password', `无法连接后端：${loginUrl}。请确认后端已启动并检查网络。`);
            } finally {
                hideLoading();
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
